<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UnyKorn Command</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif;
        background: radial-gradient(circle at 30% 20%, #1f2d63, #090e1f 60%);
        color: #e8eeff;
        display: grid;
        place-items: center;
      }
      .shell {
        width: min(840px, 92vw);
        background: rgba(9, 14, 31, 0.82);
        border: 1px solid rgba(144, 167, 255, 0.35);
        border-radius: 16px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
        padding: 24px;
      }
      h1 {
        margin: 0 0 8px 0;
        font-size: 28px;
      }
      p {
        margin: 0 0 16px 0;
        color: #a6b8f0;
      }
      textarea,
      input {
        width: 100%;
        box-sizing: border-box;
        background: #111a38;
        color: #e8eeff;
        border: 1px solid #32457f;
        border-radius: 10px;
        padding: 10px;
        font: inherit;
      }
      textarea {
        min-height: 92px;
        resize: vertical;
      }
      .row {
        display: grid;
        gap: 10px;
      }
      .actions {
        display: flex;
        gap: 10px;
        margin-top: 12px;
      }
      button {
        border: none;
        border-radius: 10px;
        background: #3e64ff;
        color: white;
        padding: 10px 14px;
        font: inherit;
        cursor: pointer;
      }
      button.secondary {
        background: #1b274e;
        border: 1px solid #344a87;
      }
      #answer {
        margin-top: 12px;
        white-space: pre-wrap;
        background: #0a1021;
        border: 1px solid #24345e;
        border-radius: 10px;
        min-height: 120px;
        padding: 12px;
      }
      #status {
        margin-top: 10px;
        color: #9fb2ee;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <h1>UnyKorn Command Surface</h1>
      <p>Send commands to your local sovereign browser daemon.</p>
      <div class="row">
        <label for="daemon-url">Daemon URL</label>
        <input id="daemon-url" type="text" placeholder="http://127.0.0.1:8787" />
      </div>
      <div class="row" style="margin-top: 12px">
        <label for="prompt">Command</label>
        <textarea id="prompt" placeholder="Summarize the market moves from my current tabs and list risk flags."></textarea>
      </div>
      <div class="actions">
        <button id="run">Run Command</button>
        <button id="save-url" class="secondary">Save Daemon URL</button>
      </div>
      <div id="status"></div>
      <pre id="answer"></pre>
    </main>
    <script src="newtab.js"></script>
  </body>
</html>
