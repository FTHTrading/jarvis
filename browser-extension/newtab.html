<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UnyKorn Command</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="newtab">
    <main class="command-shell">
      <div class="mark large">U</div>
      <p class="eyebrow">Digital Giant | OpenClaw | Jarvis</p>
      <h1>Command UnyKorn</h1>
      <p class="subtitle">Sovereign browser layer for page intelligence, dApp risk, and operator routing.</p>

      <form id="command-form" class="command-form">
        <input id="command-input" autocomplete="off" placeholder="Ask UnyKorn anything..." />
        <button type="submit">Send</button>
      </form>

      <nav class="quick-links" aria-label="Quick links">
        <a href="https://hail.unykorn.org">Hail</a>
        <a href="https://storm.unykorn.org">Storm</a>
        <a href="https://law.unykorn.org">Law</a>
        <a href="https://command.unykorn.ai">Command</a>
      </nav>

      <section id="newtab-result" class="result wide" aria-live="polite"></section>
    </main>

    <script src="newtab.js"></script>
  </body>
</html>
